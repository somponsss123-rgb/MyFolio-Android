
name: Build MyFolio APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-apk.yml'
      - 'MyFolio-V8-Upload-GitHub.zip'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Extract and fix Android source
        shell: bash
        run: |
          set -euo pipefail
          unzip -oq MyFolio-V8-Upload-GitHub.zip -x '.github/workflows/*'
          test -s app/src/main/assets/index.html
          test -f app/src/main/java/com/myfolio/app/MainActivity.java
          if ! grep -qF 'import android.widget.Toast;' app/src/main/java/com/myfolio/app/MainActivity.java; then
            sed -i '/^package .*;/a import android.widget.Toast;' app/src/main/java/com/myfolio/app/MainActivity.java
          fi
          grep -nF 'import android.widget.Toast;' app/src/main/java/com/myfolio/app/MainActivity.java

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyFolio-V8-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
