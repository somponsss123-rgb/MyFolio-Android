name: Build APK from ZIP

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Unzip the project (finds the ZIP in the repo root)
        run: |
          set -e
          mapfile -t ZIPS < <(find . -maxdepth 1 -name '*.zip' -printf '%f\n' | sort -rV)
          FOUND=""
          for z in "${ZIPS[@]}"; do
            if unzip -l "$z" | grep -q 'settings.gradle'; then FOUND="$z"; break; fi
          done
          if [ -z "$FOUND" ]; then
            echo "::error::ไม่พบไฟล์ .zip ที่เป็นโปรเจกต์ (ต้องมี settings.gradle.kts อยู่ข้างใน) กรุณาอัปโหลดไฟล์ zip ไว้ที่หน้าแรกของ repository"
            exit 1
          fi
          echo "Using $FOUND"
          mkdir -p "$RUNNER_TEMP/proj"
          unzip -q "$FOUND" -d "$RUNNER_TEMP/proj"
          ROOT=$(dirname "$(find "$RUNNER_TEMP/proj" -name 'settings.gradle*' | head -n1)")
          echo "PROJECT_DIR=$ROOT" >> "$GITHUB_ENV"
          ls -la "$ROOT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Decode keystore (only if secrets are set)
        if: env.KS_B64 != ''
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build debug + release APK
        run: |
          cd "$PROJECT_DIR"
          gradle :app:assembleDebug :app:assembleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: MyFolio-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/**/*.apk
